version: 2
updates:
  # Go and web dependencies, grouped into one PR each a week
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    groups:
      go: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'] }
    ignore:
      # svelte-check 4 supports TypeScript 5 and 6 only
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  # keeps the commit-pinned Actions in the workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
  # the base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ['*'] }
