# Splitwiz: `docker compose up -d`, then open http://localhost:8090 and add
# the two people on the setup screen.
#
# Every ${NAME:-default} below can be set in a .env file next to this one
# (see .env.example), so updates never overwrite your settings. Or just edit
# the default after ":-". scripts/install.sh writes the .env for you.
#
# On a NAS, paste this file into its Docker app (Synology Container Manager,
# QNAP Container Station, Portainer, ...). See docs/synology.md.
services:
  splitwiz:
    image: ghcr.io/selfhostit/splitwiz:${SPLITWIZ_VERSION:-1}
    container_name: splitwiz
    restart: always
    ports:
      # 127.0.0.1: only this machine and a reverse proxy on it can connect.
      # 0.0.0.0: every device on your network can, at http://<this-machine>:8090
      - "${SPLITWIZ_LISTEN:-127.0.0.1}:${SPLITWIZ_PORT:-8090}:8090"
    volumes:
      - ${SPLITWIZ_DATA:-./pb_data}:/app/pb_data # database, uploads, backups and the push key
    environment:
      - TZ=${TZ:-UTC} # your time zone, e.g. Europe/Brussels: when repeating expenses and backups run
      - SPLITWIZ_PUSH_CONTACT=${SPLITWIZ_PUSH_CONTACT:-} # optional mailto: or https: address for push services
      - PUID=${PUID:-1000} # the user (and group) Splitwiz runs as, who owns the data folder
      - PGID=${PGID:-1000}
    # Splitwiz starts as root only to give the data folder to PUID:PGID, then runs as that
    # user; switching drops these capabilities again. It can't gain new privileges, and
    # nothing in the container can be changed apart from the data folder and /tmp.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
